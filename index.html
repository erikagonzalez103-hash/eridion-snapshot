<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eridion Glass — Financial Snapshot</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F4F5F7;color:#1a1a1a;font-size:13px}
.wrap{max-width:980px;margin:0 auto;padding:16px}
.snap{background:#fff;border:1px solid #e0e0e0;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
.snap-hdr{background:#0D1B2A;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.snap-brand{font-size:14px;font-weight:600;color:#fff;letter-spacing:.3px}
.snap-meta{font-size:11px;color:#C8963E;margin-top:2px}
.snap-actions{display:flex;gap:8px;align-items:center}
.btn{padding:6px 14px;border-radius:6px;font-size:11px;font-weight:500;cursor:pointer;border:none;transition:all .12s}
.btn-print{background:#C8963E;color:#0D1B2A}
.btn-print:hover{background:#E8A84E}
.btn-refresh{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35)}
.btn-refresh:hover{background:rgba(255,255,255,.1);border-color:#fff}
.src-badge{background:#E1F5EE;color:#0F6E56;padding:2px 9px;border-radius:10px;font-size:10px;font-weight:600}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#0D1B2A;color:#fff;padding:12px 18px;border-radius:8px;font-size:12px;box-shadow:0 6px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:all .25s;z-index:200;max-width:340px;line-height:1.5}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast strong{color:#C8963E}
.tab-bar{display:flex;border-bottom:1px solid #e0e0e0;background:#F8F9FA;overflow-x:auto}
.tab{padding:11px 18px;font-size:12px;font-weight:500;color:#666;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .12s}
.tab:hover{color:#0D1B2A;background:#fff}
.tab.active{color:#0D1B2A;border-bottom-color:#C8963E;background:#fff}
.tab-content{display:none;padding:18px 20px}
.tab-content.active{display:block}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.metric{background:#F8F9FA;border-radius:8px;padding:13px;text-align:center;border:1px solid #eee}
.metric .val{font-size:21px;font-weight:600;line-height:1.2}
.metric .lbl{font-size:10px;color:#888;margin-top:3px;text-transform:uppercase;letter-spacing:.05em}
.metric .sub{font-size:9px;color:#aaa;margin-top:3px;line-height:1.3}
.green{color:#0F6E56}.red{color:#A32D2D}.amber{color:#854F0B}.navy{color:#0D1B2A}
.slbl{font-size:10px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.06em;margin:14px 0 7px}
.flags{display:flex;flex-direction:column;gap:5px}
.flag{padding:9px 12px;border-radius:6px;font-size:11px;font-weight:500;line-height:1.5}
.flag.danger{background:#FCEBEB;color:#791F1F;border-left:3px solid #E24B4A}
.flag.warn{background:#FAEEDA;color:#633806;border-left:3px solid #BA7517}
.flag.ok{background:#E1F5EE;color:#085041;border-left:3px solid #1D9E75}
.flag.insight{background:#EEEDFE;color:#26215C;border-left:3px solid #534AB7}
.prog-wrap{background:#F0F0F2;border-radius:6px;height:20px;overflow:visible;margin:6px 0;position:relative}
.prog-fill{height:100%;border-radius:6px;transition:width .3s ease;position:relative;z-index:1}
.prog-pace{position:absolute;top:-4px;bottom:-4px;width:2px;background:#0D1B2A;z-index:2;pointer-events:none}
.prog-pace::after{content:attr(data-label);position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:600;color:#0D1B2A;white-space:nowrap;background:#fff;padding:1px 4px;border-radius:3px;border:1px solid #0D1B2A}
.prog-fill.green{background:#1D9E75}.prog-fill.amber{background:#C8963E}.prog-fill.red{background:#A32D2D}
table{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed}
th{text-align:left;padding:7px 9px;font-size:10px;font-weight:600;color:#fff;background:#0D1B2A;letter-spacing:.04em}
th.r{text-align:right}
td{padding:7px 9px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
td.r{text-align:right;font-variant-numeric:tabular-nums}
tr:nth-child(even) td{background:#FAFAFA}
tr.total td{background:#F4F5F7;font-weight:600;border-top:2px solid #C8963E}
tr.proj td{color:#999;font-style:italic}
tr.cur-year td{background:#FBF3E2}
tr.yoy-total td{background:#0D1B2A;color:#C8963E;font-weight:600}
tr.yoy-total td.r{color:#C8963E}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;padding:6px 0;border-bottom:1px solid #eee;margin-bottom:4px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar{width:70%;background:#1D9E75;border-radius:3px 3px 0 0;min-height:2px;transition:height .3s}
.bar.prior{background:#C9CDD3}
.bar-lbl{font-size:9px;color:#888;margin-top:4px}
.bar-val{font-size:9px;color:#555;margin-bottom:3px;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;font-size:10px;color:#888;margin:8px 0}
.legend span{display:flex;align-items:center;gap:4px}
.dot{width:9px;height:9px;border-radius:2px;display:inline-block}
.footer{background:#F4F5F7;padding:10px 20px;font-size:10px;color:#aaa;text-align:center;border-top:1px solid #eee}
.note{font-size:10px;color:#aaa;margin-top:8px;line-height:1.5}
@media print{
  body{background:#fff;font-size:10px}
  .wrap{padding:0;max-width:100%}
  .snap{box-shadow:none;border:none;border-radius:0}
  .snap-actions{display:none}
  .tab-bar{display:none}
  .tab-content{display:block!important;padding:12px 16px;page-break-inside:avoid}
  .tab-content::before{content:attr(data-title);display:block;font-size:13px;font-weight:600;color:#0D1B2A;padding:8px 0 4px;border-bottom:2px solid #C8963E;margin-bottom:12px}
  .tab-content+.tab-content{border-top:2px solid #0D1B2A}
  tr{page-break-inside:avoid}
  @page{size:letter;margin:0.6in 0.5in}
}
</style>
</head>
<body>
<div class="wrap">
<div class="snap">

<div class="snap-hdr">
  <div>
    <div class="snap-brand">ERIDION GLASS — Financial Snapshot</div>
    <div class="snap-meta" id="hdr-meta">Loading…</div>
  </div>
  <div class="snap-actions">
    <span class="src-badge" id="src-badge">Xero · cash basis</span>
    <button class="btn btn-refresh" id="refresh-btn" title="Copies the phrase to refresh these numbers">&#8635; Refresh</button>
    <button class="btn btn-print" onclick="window.print()">Print / Save PDF</button>
  </div>
</div>

<div class="tab-bar">
  <div class="tab active" onclick="switchTab('summary',this)">Summary</div>
  <div class="tab" onclick="switchTab('month',this)">This Year</div>
  <div class="tab" onclick="switchTab('yoy',this)">YOY Sales</div>
</div>

<!-- SUMMARY -->
<div class="tab-content active" id="tab-summary" data-title="Executive Summary">
  <div class="metrics" id="sum-metrics"></div>

  <div class="slbl">2026 vs last year — sales collected year to date</div>
  <div style="display:flex;justify-content:space-between;font-size:10px;color:#888;margin-bottom:3px">
    <span id="fc-ytd"></span><span id="fc-proj" class="amber"></span><span id="fc-goal"></span>
  </div>
  <div class="prog-wrap"><div class="prog-fill" id="fc-bar" style="width:0%"></div><div class="prog-pace" id="fc-pace" style="display:none"></div></div>
  <div style="font-size:10px;color:#aaa;margin-top:4px" id="fc-sub"></div>

  <div class="slbl" style="margin-top:18px">Flags &amp; what needs attention</div>
  <div class="flags" id="sum-flags"></div>
</div>

<!-- THIS YEAR -->
<div class="tab-content" id="tab-month" data-title="This Year — Monthly Detail">
  <div class="slbl" style="margin-top:0">2026 monthly sales vs 2025 (cash collected)</div>
  <div class="bars" id="year-bars"></div>
  <div class="legend">
    <span><i class="dot" style="background:#1D9E75"></i> 2026 actual</span>
    <span><i class="dot" style="background:#C9CDD3"></i> 2025</span>
  </div>

  <div class="slbl" style="margin-top:16px">Who paid you last month (<span id="cust-month">June</span>)</div>
  <table>
    <thead><tr><th style="width:60%">Customer</th><th class="r" style="width:40%">Paid</th></tr></thead>
    <tbody id="cust-body"></tbody>
  </table>

  <div class="slbl" style="margin-top:16px">Money position right now</div>
  <table>
    <tbody id="pos-body"></tbody>
  </table>
  <div class="note" id="month-note"></div>
</div>

<!-- YOY -->
<div class="tab-content" id="tab-yoy" data-title="Year-Over-Year Sales (cash basis)">
  <div style="overflow-x:auto">
    <table id="yoy-table">
      <thead><tr id="yoy-hdr"></tr></thead>
      <tbody id="yoy-body"></tbody>
    </table>
  </div>
  <div class="note" id="yoy-note"></div>
</div>

<div class="footer" id="snap-footer"></div>
</div>
</div>
<div class="toast" id="toast"></div>

<script>
// ── Refresh button: copies the phrase for Claude to refresh the data.
//    A static page can't message Claude directly, so this puts the exact
//    ask on the clipboard — paste it into your Claude chat and the numbers
//    get re-pulled from Xero and rebuilt.
(function(){
  const btn=document.getElementById('refresh-btn'), toast=document.getElementById('toast');
  function showToast(html){toast.innerHTML=html;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),5200);}
  btn.addEventListener('click', async ()=>{
    const phrase='refresh my snapshot';
    try{ await navigator.clipboard.writeText(phrase);
      showToast('Copied <strong>"refresh my snapshot"</strong> — paste it into your Claude chat and I\'ll re-pull Xero and update these numbers.');
    }catch(e){
      showToast('Tell Claude: <strong>"refresh my snapshot"</strong> — I\'ll re-pull Xero and update these numbers. (Clipboard was blocked.)');
    }
  });
})();
</script>

<script>
// ═══════════════════════════════════════════════════════════════════════
//  ERIDION SNAPSHOT — data embedded, refreshed by Claude from live Xero.
//  Basis: CASH (revenue counted when an invoice is PAID) — matches Erika's
//  historical Excel. To refresh: re-pull Xero cash P&L per month + cash
//  position + top customers, update the DATA block below, commit.
// ═══════════════════════════════════════════════════════════════════════
const DATA = {
  asOf: '2026-07-01',
  xeroSynced: '2026-06-25',          // Xero MCP last-refresh timestamp
  currentYear: 2026,
  monthsElapsed: 6,                  // full months of 2026 with data (Jan–Jun)
  annualGoal: 1000000,               // Erika's stated $1MM goal

  cashOnHand: 32870.89,
  arOwed: 40421.47,                  // total owed to Eridion (Xero amount_owed)
  arOverdue: 23148.51,               // overdue portion (includes stale ghosts)
  arGhostNote: '~$9.7k of the overdue A/R is stale 2024 Grand Homes invoices (899 days old) — write off or chase hard.',
  apOwed: 1061.99,                   // bills Eridion owes (Xero amount_due)
  goalMoM: 0.05,                     // forecast method: +5%/month stretch goal to push toward
  arAwaitingCount: 19,               // open (not-yet-due) invoice count
  arOverdueCount: 17,                // overdue invoice count
  arOpenTop: [                       // largest open invoices (from Xero receivables)
    {inv:'INV-1489', who:'Grand Homes',                amt:7167.74, age:899,  ghost:true},
    {inv:'2128',     who:'Grand Homes North Division', amt:3661.18, age:null, ghost:false, note:'due Jul 25'},
    {inv:'INV-1488', who:'Grand Homes',                amt:2565.65, age:899,  ghost:true},
  ],

  // Who paid last completed month (cash), from Xero top-customers
  lastClosedMonthName: 'June 2026',
  lastMonthCustomers: [
    {name:'Grand Homes North Division', amt:37927.15},
    {name:'Trinity Stairs',             amt:15658.21},
    {name:'Pennington Commercial',      amt:6925.29},
    {name:'Hines Homes',                amt:3543.00},
    {name:'Roof Raiders and Co',        amt:601.32},
  ],

  // Monthly SALES (cash), Jan..Dec. null = no data.
  // 2020–2024 from Eridion's historical table (verified to annual totals). 2025–2026 from Xero (cash).
  yoy: {
    2020:[null,null,null,null,7549.88,6070.48,null,4942.82,13260.02,3859.18,3336.47,6995.92],
    2021:[1345.58,2118.46,8872.94,18391.21,14365.71,20700.22,12262.68,13543.38,12162.48,15814.62,6015.06,32250.98],
    2022:[23202.44,12310.16,25692.91,16945.45,13301.29,26604.62,31618.00,25516.07,38179.73,10914.15,34125.00,47167.49],
    2023:[27459.45,20074.63,17686.07,19020.95,32038.42,28305.08,46778.69,25874.67,27355.89,33941.93,23502.07,20577.57],
    2024:[32783.11,32324.72,68312.19,48943.87,62403.35,48149.22,55800.42,25292.17,18986.46,66186.87,23832.76,60840.91],
    2025:[55184.62,68352.97,52234.17,51042.38,70960.77,82000.08,43062.37,27645.28,63132.47,47195.48,45836.80,39536.43],
    2026:[33119.91,47110.88,56449.01,26343.69,43570.32,61017.19,null,null,null,null,null,null],
  },
};

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const YEARS = [2020,2021,2022,2023,2024,2025,2026];
const fmt  = n => n!=null ? '$'+Math.round(n).toLocaleString() : '—';
const fmtD = n => n!=null ? '$'+n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',') : '—';
const sum  = a => a.reduce((s,v)=>s+(v||0),0);

// ── Derived numbers ─────────────────────────────────────────────────────
const y = DATA.yoy;
const annual = {}; YEARS.forEach(yr => annual[yr] = sum(y[yr]));
const me = DATA.monthsElapsed;
const ytd26 = sum(y[2026].slice(0, me));
const ytd25 = sum(y[2025].slice(0, me));
const growthYTD = ytd25 ? (ytd26/ytd25 - 1) : 0;         // honest reality check vs last year
const lastActualIdx = me - 1;
const lastClosed = y[2026][lastActualIdx];
// Forecast = Erika's goal method: grow +5%/month from the last actual month, as a stretch target.
const goalFor = i => i >= me ? lastClosed * Math.pow(1 + DATA.goalMoM, i - lastActualIdx) : null;
let projRemainder = 0; for (let i = me; i < 12; i++) projRemainder += goalFor(i);
const projFY26 = ytd26 + projRemainder;                  // YTD actual + goal-paced remainder
const bestMonthIdx = y[2026].slice(0,me).reduce((bi,v,i,a)=> v>a[bi]?i:bi, 0);

// ── Header / footer ─────────────────────────────────────────────────────
const asOfNice = new Date(DATA.asOf+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
document.getElementById('hdr-meta').textContent = 'As of '+asOfNice+'  ·  Cash basis  ·  Source: Xero';
document.getElementById('src-badge').textContent = 'Xero · synced '+new Date(DATA.xeroSynced+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
document.getElementById('snap-footer').textContent = 'Eridion Glass, LLC  ·  numbers pulled live from Xero (cash basis) and reconciled  ·  refreshed '+asOfNice;

// ── SUMMARY: metric cards ───────────────────────────────────────────────
const growthPct = Math.round(growthYTD*100);
document.getElementById('sum-metrics').innerHTML = [
  {val:fmt(lastClosed), lbl:DATA.lastClosedMonthName.split(' ')[0]+' collected', sub:'last full month', cls:'green'},
  {val:fmt(ytd26), lbl:'2026 YTD', sub:'through '+MONTHS[me-1]+' · cash', cls:'navy'},
  {val:(growthPct>=0?'+':'')+growthPct+'%', lbl:'vs 2025 pace', sub:fmt(ytd26)+' vs '+fmt(ytd25)+' by now', cls: growthPct>=0?'green':'red'},
  {val:fmt(projFY26), lbl:'2026 forecast', sub:'goal pace · +5%/mo', cls:'amber'},
].map(m=>`<div class="metric"><div class="val ${m.cls}">${m.val}</div><div class="lbl">${m.lbl}</div><div class="sub">${m.sub}</div></div>`).join('');

// ── SUMMARY: YTD progress vs prior-year pace (honest) ───────────────────
// Bar = 2026 YTD as % of 2025 YTD. Pace tick at 100% = "matching last year".
const barPct = Math.min(Math.round(ytd26/ytd25*100),100);
const fcBar = document.getElementById('fc-bar');
fcBar.style.width = barPct+'%';
fcBar.classList.add(growthYTD>=0?'green':growthYTD>=-0.1?'amber':'red');
const pace = document.getElementById('fc-pace');
pace.style.display='block'; pace.style.left='100%'; pace.setAttribute('data-label','2025 pace');
document.getElementById('fc-ytd').textContent = '2026 YTD: '+fmt(ytd26);
document.getElementById('fc-proj').textContent = 'Goal forecast: '+fmt(projFY26)+' (+5%/mo)';
document.getElementById('fc-goal').textContent = '2025 by now: '+fmt(ytd25);
document.getElementById('fc-sub').innerHTML =
  `Bar shows 2026 collected vs where 2025 stood by this date — you're <strong>${Math.abs(growthPct)}% behind</strong> last year's pace. `+
  `The forecast (<strong>${fmt(projFY26)}</strong>) is a stretch goal: +5%/month from ${MONTHS[lastActualIdx]} to push toward, not a run-rate.`;

// ── SUMMARY: flags (computed from real data) ────────────────────────────
const flags = [];
if (growthYTD < -0.05) flags.push({type:'danger', text:
  `<strong>2026 is pacing ${Math.abs(growthPct)}% behind 2025.</strong> ${fmt(ytd26)} collected through ${MONTHS[me-1]} vs ${fmt(ytd25)} by this point last year — a ${fmt(ytd25-ytd26)} gap. Every month Apr–Jun came in under the prior year.`});
flags.push({type:'ok', text:
  `<strong>${MONTHS[bestMonthIdx]} was your strongest month of 2026</strong> at ${fmt(y[2026][bestMonthIdx])} cash collected. ${DATA.lastClosedMonthName.split(' ')[0]} closed at ${fmt(lastClosed)}.`});
flags.push({type:'insight', text:
  `<strong>Goal forecast:</strong> at +5%/month from ${MONTHS[lastActualIdx]}, 2026 targets <strong>${fmt(projFY26)}</strong> — just above 2025's ${fmt(annual[2025])}. That's the number to push toward; the current run-rate is behind it, so H2 has to beat H1.`});
flags.push({type:'warn', text:
  `<strong>${fmt(DATA.arOwed)} shows as owed to you</strong>, but that figure is usually inflated by ghost invoices and small unaccounted leftovers. ${DATA.arGhostNote} Open the A/R line on the "This Year" tab to see what's actually outstanding.`});
flags.push({type:'insight', text:
  `<strong>Bills you owe:</strong> only ${fmt(DATA.apOwed)} in payables — no A/P squeeze. This year's story is top-line sales, not cost.`});
document.getElementById('sum-flags').innerHTML = flags.map(f=>`<div class="flag ${f.type}">${f.text}</div>`).join('');

// ── THIS YEAR: 2026 vs 2025 monthly bars ────────────────────────────────
const maxBar = Math.max(...y[2026].map(v=>v||0), ...y[2025]);
document.getElementById('year-bars').innerHTML = MONTHS.map((m,i)=>{
  const a = y[2026][i], p = y[2025][i];
  const aH = a!=null ? Math.round(a/maxBar*100) : 0;
  const pH = Math.round((p||0)/maxBar*100);
  const barSet = a!=null
    ? `<div class="bar-val">${a!=null?Math.round(a/1000)+'k':''}</div><div class="bar" style="height:${aH}%" title="2026 ${m}: ${fmt(a)}"></div>`
    : `<div class="bar prior" style="height:${pH}%;opacity:.55" title="2025 ${m}: ${fmt(p)}"></div>`;
  return `<div class="bar-col">${barSet}<div class="bar-lbl">${m}</div></div>`;
}).join('');

// ── THIS YEAR: last-month customer breakdown ────────────────────────────
document.getElementById('cust-month').textContent = DATA.lastClosedMonthName.split(' ')[0];
const custTotal = sum(DATA.lastMonthCustomers.map(c=>c.amt));
document.getElementById('cust-body').innerHTML =
  DATA.lastMonthCustomers.map(c=>`<tr><td>${c.name}</td><td class="r">${fmtD(c.amt)}</td></tr>`).join('') +
  `<tr class="total"><td>Top customers total</td><td class="r green">${fmtD(custTotal)}</td></tr>`;

// ── THIS YEAR: money position ───────────────────────────────────────────
const moreOpen = (DATA.arAwaitingCount + DATA.arOverdueCount) - DATA.arOpenTop.length;
document.getElementById('pos-body').innerHTML =
  `<tr id="ar-toggle" style="cursor:pointer"><td>Owed to you (A/R) &nbsp;<span id="ar-caret" style="color:#888;font-size:10px">&#9656; what's open</span></td><td class="r green">${fmt(DATA.arOwed)}</td></tr>` +
  DATA.arOpenTop.map(o=>`<tr class="ar-detail" style="display:none"><td style="padding-left:24px;font-size:10px;color:#666">${o.inv} · ${o.who}${o.ghost?` &nbsp;<span style="color:#A32D2D">${o.age}d old · likely ghost</span>`:(o.note?` · ${o.note}`:'')}</td><td class="r" style="font-size:10px;color:#666">${fmt(o.amt)}</td></tr>`).join('') +
  `<tr class="ar-detail" style="display:none"><td style="padding-left:24px;font-size:10px;color:#888">…and ${moreOpen} more open invoices — full itemized list arrives with the Monday worker (Xero invoice API)</td><td></td></tr>` +
  `<tr><td style="color:#854F0B">— of which overdue</td><td class="r amber">${fmt(DATA.arOverdue)}</td></tr>` +
  `<tr><td>Bills you owe (A/P)</td><td class="r red">${fmt(DATA.apOwed)}</td></tr>`;
document.getElementById('ar-toggle').addEventListener('click', () => {
  const hidden = document.querySelector('.ar-detail').style.display === 'none';
  document.querySelectorAll('.ar-detail').forEach(r => r.style.display = hidden ? 'table-row' : 'none');
  document.getElementById('ar-caret').innerHTML = (hidden ? '&#9662;' : '&#9656;') + " what's open";
});
document.getElementById('month-note').textContent =
  'Customer breakdown = cash received in '+DATA.lastClosedMonthName+' (top payers). Per-invoice detail and Profit First bucket balances live in the Profit First Ledger.';

// ── YOY TABLE ───────────────────────────────────────────────────────────
document.getElementById('yoy-hdr').innerHTML =
  '<th style="width:64px">Month</th>' + YEARS.map(yr=>`<th class="r"${yr===2026?' style="color:#C8963E"':''}>${yr}</th>`).join('');

let rows='';
MONTHS.forEach((m,i)=>{
  const cells = YEARS.map(yr=>{
    let v = y[yr][i], cls='r', style='';
    if (yr===2026 && v==null && goalFor(i)!=null){ v = Math.round(goalFor(i)); style='color:#999;font-style:italic'; }
    else if (yr===2026 && v!=null){ style='color:#0F6E56;font-weight:600'; }
    return `<td class="${cls}" style="${style}">${v!=null?fmt(v):'—'}</td>`;
  }).join('');
  rows += `<tr><td>${m}</td>${cells}</tr>`;
});
// totals row
const projTotal26 = ytd26 + projRemainder;
const totCells = YEARS.map(yr=>{
  const v = yr===2026 ? projTotal26 : annual[yr];
  return `<td class="r">${fmt(v)}</td>`;
}).join('');
rows += `<tr class="yoy-total"><td>TOTAL</td>${totCells}</tr>`;
// growth row
let growthCells='';
YEARS.forEach((yr,idx)=>{
  if(idx===0){ growthCells+='<td class="r" style="color:#ccc">—</td>'; return; }
  const cur = yr===2026 ? projTotal26 : annual[yr];
  const prev = annual[YEARS[idx-1]];
  const g = prev? Math.round((cur-prev)/prev*100):0;
  const c = g>=0?'#0F6E56':'#A32D2D';
  growthCells += `<td class="r" style="color:${c};font-size:10px">${g>=0?'+':''}${g}%</td>`;
});
rows += `<tr><td style="font-size:10px;color:#888">Growth</td>${growthCells}</tr>`;
document.getElementById('yoy-body').innerHTML = rows;

document.getElementById('yoy-note').innerHTML =
  `2020–2024 from Eridion's historical table; 2025–2026 from Xero (cash basis). 2023 cross-checks against Xero to within $466, confirming both are on the same footing. `+
  `2026 <em>Jul–Dec are goal targets</em> — +5%/month from ${MONTHS[lastActualIdx]}'s actual, to push the year (grey italic), not a run-rate projection. `+
  `The $992k "2025" column in the old sheet was a goal, not actuals — real 2025 was ${fmt(annual[2025])}.`;

// ── TABS ────────────────────────────────────────────────────────────────
function switchTab(id, el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  if(el) el.classList.add('active');
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
}
</script>
